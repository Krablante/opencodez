name: publish
run-name: "release ${{ inputs.release_version }}"

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, without leading v. Example: 1.18.13+opencodez.1"
        required: true
        type: string
      binary_version:
        description: "Version embedded in the binary. Defaults to the complete release_version."
        required: false
        type: string
      draft:
        description: "Leave the GitHub Release as a draft after uploading assets."
        required: false
        default: false
        type: boolean

concurrency: publish-${{ github.ref }}-${{ inputs.release_version }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      binary_version: ${{ steps.release.outputs.binary_version }}
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_BINARY_VERSION: ${{ inputs.binary_version }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          release_version="$INPUT_RELEASE_VERSION"
          binary_version="$INPUT_BINARY_VERSION"
          draft="$INPUT_DRAFT"

          release_version="${release_version#v}"
          if [[ -z "$binary_version" ]]; then
            binary_version="$release_version"
          fi
          binary_version="${binary_version#v}"

          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$release_version" =~ $semver ]]; then
            echo "release_version must be semver-like, for example 1.18.13+opencodez.1" >&2
            exit 1
          fi
          if [[ "$release_version" != *opencodez* ]]; then
            echo "release_version must be OpenCodez-specific, for example 1.18.13+opencodez.1" >&2
            exit 1
          fi
          if [[ ! "$binary_version" =~ $semver ]]; then
            echo "binary_version must be semver-like, for example 1.18.13+opencodez.1" >&2
            exit 1
          fi

          {
            echo "release_version=$release_version"
            echo "binary_version=$binary_version"
            echo "tag=v$release_version"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun

      - name: Configure git identity
        shell: bash
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Typecheck core
        working-directory: packages/core
        run: bun typecheck

      - name: Typecheck runtime
        working-directory: packages/opencode
        run: bun typecheck

      - name: Typecheck app
        working-directory: packages/app
        run: bun typecheck

      - name: Typecheck session UI
        working-directory: packages/session-ui
        run: bun typecheck

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

  build-and-publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install archive tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null || ! command -v unzip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip unzip
          fi

      - name: Build OpenCodez CLI assets
        shell: bash
        env:
          OPENCODEZ_BUILD: "1"
          OPENCODE_VERSION: ${{ needs.prepare.outputs.binary_version }}
          OPENCODE_CHANNEL: latest
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./packages/opencode/script/build.ts

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode/dist
          shopt -s nullglob

          for dir in opencodez-*; do
            [[ -d "$dir/bin" ]] || continue
            case "$dir" in
              opencodez-linux-*)
                tar -czf "$dir.tar.gz" -C "$dir/bin" opencodez
                ;;
              opencodez-windows-*)
                (cd "$dir/bin" && zip -q -r "../../$dir.zip" opencodez.exe)
                ;;
              opencodez-darwin-*)
                (cd "$dir/bin" && zip -q -r "../../$dir.zip" opencodez)
                ;;
              *)
                echo "Unexpected OpenCodez dist directory: $dir" >&2
                exit 1
                ;;
            esac
          done

          for archive in opencodez-*.tar.gz opencodez-*.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          cd packages/opencode/dist

          expected=(
            opencodez-darwin-arm64.zip
            opencodez-darwin-x64.zip
            opencodez-darwin-x64-baseline.zip
            opencodez-linux-arm64.tar.gz
            opencodez-linux-arm64-musl.tar.gz
            opencodez-linux-x64.tar.gz
            opencodez-linux-x64-baseline.tar.gz
            opencodez-linux-x64-baseline-musl.tar.gz
            opencodez-linux-x64-musl.tar.gz
            opencodez-windows-arm64.zip
            opencodez-windows-x64.zip
            opencodez-windows-x64-baseline.zip
          )

          for file in "${expected[@]}"; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum -c "$file.sha256"
          done

          actual_count="$(find . -maxdepth 1 -type f \( -name 'opencodez-*.tar.gz' -o -name 'opencodez-*.zip' \) | wc -l | tr -d ' ')"
          if [[ "$actual_count" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} OpenCodez archives, found $actual_count" >&2
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sort >&2
            exit 1
          fi

          tar -tzf opencodez-linux-x64.tar.gz | grep -qx 'opencodez'
          unzip -Z1 opencodez-darwin-x64.zip | grep -qx 'opencodez'
          unzip -Z1 opencodez-windows-x64.zip | grep -qx 'opencodez.exe'
          ./opencodez-linux-x64/bin/opencodez --version | grep -qx '${{ needs.prepare.outputs.binary_version }}'
          ./opencodez-linux-x64/bin/opencodez --help 2>&1 | grep -q 'opencodez'
          ./opencodez-linux-x64/bin/opencodez --help 2>&1 | grep -q 'update'

      - name: Create or reuse draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/opencodez-release.json 2>/dev/null; then
            is_draft="$(jq -r '.isDraft' /tmp/opencodez-release.json)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG already exists and is not a draft." >&2
              exit 1
            fi
          else
            gh release create "$TAG" \
              --draft \
              --latest \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "OpenCodez release $TAG." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages/opencode/dist -maxdepth 1 -type f \( -name 'opencodez-*.tar.gz' -o -name 'opencodez-*.zip' -o -name 'opencodez-*.sha256' \) | sort)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          archives=(
            opencodez-darwin-arm64.zip
            opencodez-darwin-x64.zip
            opencodez-darwin-x64-baseline.zip
            opencodez-linux-arm64.tar.gz
            opencodez-linux-arm64-musl.tar.gz
            opencodez-linux-x64.tar.gz
            opencodez-linux-x64-baseline.tar.gz
            opencodez-linux-x64-baseline-musl.tar.gz
            opencodez-linux-x64-musl.tar.gz
            opencodez-windows-arm64.zip
            opencodez-windows-x64.zip
            opencodez-windows-x64-baseline.zip
          )
          expected=()
          for archive in "${archives[@]}"; do
            expected+=("$archive" "$archive.sha256")
          done
          mapfile -t actual < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)

          if [[ "${#actual[@]}" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} uploaded assets, found ${#actual[@]}" >&2
            printf '%s\n' "${actual[@]}" >&2
            exit 1
          fi

          for file in "${expected[@]}"; do
            printf '%s\n' "${actual[@]}" | grep -qx "$file"
          done
          if printf '%s\n' "${actual[@]}" | grep -q '^opencode-'; then
            echo "Unexpected upstream opencode-* asset uploaded." >&2
            printf '%s\n' "${actual[@]}" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: needs.prepare.outputs.draft != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
